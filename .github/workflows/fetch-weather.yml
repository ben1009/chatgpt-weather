name: Fetch Weather

on:
  push:
    branches:
      - main
    paths:
      - "weather/trigger.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch Caiyun forecast
        env:
          CAIYUN_APP_KEY: ${{ secrets.CAIYUN_APP_KEY }}
          CAIYUN_APP_SECRET: ${{ secrets.CAIYUN_APP_SECRET }}
        run: python3 scripts/fetch_weather.py

      - name: Commit forecast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result_file="${RUNNER_TEMP}/weather-result.json"
          cp weather/weather.json "$result_file"
          request_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["request_id"])' "$result_file")"
          content="$(base64 -w0 "$result_file")"

          for attempt in 1 2 3; do
            latest_request_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/weather/trigger.json" -f "ref=$GITHUB_REF_NAME" --jq '.content | gsub("\\n"; "") | @base64d | fromjson | .request_id')"
            if [ "$latest_request_id" != "$request_id" ]; then
              echo "A newer request replaced this one; its run will publish the result."
              exit 0
            fi

            current_sha="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/weather/weather.json" -f "ref=$GITHUB_REF_NAME" --jq .sha)"
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/weather/weather.json" \
              -f message="chore: update weather forecast" \
              -f content="$content" \
              -f sha="$current_sha" \
              -f branch="$GITHUB_REF_NAME" \
              --silent; then
              exit 0
            fi

            echo "Weather result changed during the update; retrying against the latest file."
          done

          echo "Could not commit the weather result after three attempts." >&2
          exit 1
