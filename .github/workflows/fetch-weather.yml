name: Fetch Weather

on:
  push:
    branches:
      - main
    paths:
      - "weather/trigger.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-weather:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check weather handling
        run: python3 -m unittest discover -s tests

      - name: Fetch Caiyun forecast
        env:
          CAIYUN_APP_KEY: ${{ secrets.CAIYUN_APP_KEY }}
          CAIYUN_APP_SECRET: ${{ secrets.CAIYUN_APP_SECRET }}
        run: python3 scripts/fetch_weather.py

      - name: Commit forecast
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_weather.py
