name: Fetch Weather

on:
  push:
    branches:
      - main
    paths:
      - "weather/trigger.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch Caiyun forecast
        env:
          CAIYUN_APP_KEY: ${{ secrets.CAIYUN_APP_KEY }}
          CAIYUN_APP_SECRET: ${{ secrets.CAIYUN_APP_SECRET }}
        run: python3 scripts/fetch_weather.py

      - name: Commit forecast
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          result_file="${RUNNER_TEMP}/weather-result.json"
          cp weather/weather.json "$result_file"
          request_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["request_id"])' "$result_file")"
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

            latest_request_id="$(git show "origin/$GITHUB_REF_NAME:weather/trigger.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["request_id"])')"
            if [ "$latest_request_id" != "$request_id" ]; then
              echo "A newer request replaced this one; its run will publish the result."
              exit 0
            fi

            cp "$result_file" weather/weather.json
            git add weather/weather.json
            if git diff --cached --quiet; then
              echo "Weather result is already up to date."
              exit 0
            fi

            git commit -m "chore: update weather forecast"
            auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            echo "Branch changed during the push attempt; retrying against the latest commit."
          done

          echo "Could not commit the weather result after three attempts." >&2
          exit 1
